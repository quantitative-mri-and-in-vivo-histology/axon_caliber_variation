# Plot settings for axon caliber variation figures
# These settings ensure consistent styling across all plots

# Color palettes
colors:
  sham: "#1f77b4"      # Blue
  tbi: "#d62728"       # Red
  unknown: "#7f7f7f"   # Gray

  # For mean/median indicator lines in histograms
  mean_line: "red"
  median_line: "orange"

# Marker styles for populations
markers:
  cc: "o"              # Circle
  cg: "^"              # Triangle
  default: "s"         # Square

# Figure settings
figure:
  dpi: 200
  format: "svg"            # Default output format (svg or png)
  default_figsize: [10, 6]
  tight_layout: true
  suptitle: false          # No figure-level titles
  subplot_titles: false    # No individual panel titles

# Panel labels (a, b, c, ...)
panel_labels:
  enabled: true
  fontsize: 18
  fontweight: "bold"
  position: [-0.18, 0.98]  # [x, y] in axes coordinates (above ylabel)
  va: "bottom"
  ha: "right"

# Font settings
fonts:
  label_size: 14       # xlabel, ylabel
  tick_size: 12        # tick labels
  title_size: 16       # panel titles (if used)
  legend_size: 11      # legend text
  weight: "normal"

# Grid and frame settings
grid:
  enabled: false
  alpha: 0.3

frame:
  box: true            # Show all four spines (box around plot)
  linewidth: 1.0       # Spine linewidth

# Error bar settings
error_bars:
  capsize: 4
  capthick: 1.2
  linewidth: 1.2
  alpha: 0.7

# Histogram settings
histogram:
  bins: 50
  alpha: 0.7
  edgecolor: "black"

# Line plot settings
line:
  linewidth: 2
  marker_size: 5
  fill_alpha: 0.2

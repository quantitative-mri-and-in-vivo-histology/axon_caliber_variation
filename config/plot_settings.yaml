# Plot settings for axon caliber variation figures
# These settings ensure consistent styling across all plots

# =============================================================================
# Figure Color Scheme Guidelines
# =============================================================================

# Global Distinctions (consistent across all figures)
colors:
  # Species (when both shown)
  human: "#4A90D9"       # Blue
  rat: "#D94A4A"         # Red

  # Condition (rat data only) - both clearly in red family
  sham: "#E07070"        # Light brick red
  tbi: "#802020"         # Dark maroon

  # Legacy aliases (for backward compatibility)
  unknown: "#7f7f7f"     # Gray

  # For mean/median indicator lines in histograms
  mean_line: "red"
  median_line: "orange"

  # Representative examples (when showing 3 selected ROIs/axons)
  example_1: "#6B9E6B"   # Green
  example_2: "#D9864A"   # Orange
  example_3: "#8B6BAE"   # Purple

  # Local binary comparisons (overlapping histograms)
  # Use filled vs step histogram:
  # - Category A (baseline): Filled histogram, light gray
  # - Category B (comparison): Step histogram (unfilled), dark edge
  category_a: "#B0B0B0"        # Light gray (filled, alpha=0.7)
  category_b_edge: "#303030"   # Dark edge for step histogram (linewidth=2)
  # For violin/box plots (high contrast):
  category_a_violin: "#D0D0D0" # Light gray
  category_b_violin: "#505050" # Dark gray
  # Single lines/curves (no comparison):
  single_line: "#505050"       # Dark gray for single median/mean lines

  # Colored binary comparisons (when grayscale insufficient)
  # Use for scatter plots, error bars, or when colors aid interpretation
  binary_a: "#C4A77D"          # Sand/tan - warm neutral
  binary_b: "#7BA3A8"          # Dusty teal - cool neutral

# Marker styles for populations (tract, rat data only)
markers:
  cc: "o"              # Circle for corpus callosum
  cg: "^"              # Triangle for cingulum
  default: "s"         # Square

# =============================================================================
# Encoding Priority
# =============================================================================
# 1. Color for strongest distinction (species, condition)
# 2. Shape for secondary categorical (tract)
# 3. Line style (solid/dashed) as tertiary option

# =============================================================================
# Figure settings
# =============================================================================
figure:
  dpi: 200
  format: "svg"            # Default output format (svg or png)
  default_figsize: [10, 6]
  tight_layout: true
  suptitle: false          # No figure-level titles
  subplot_titles: false    # No individual panel titles

# Panel labels (a, b, c, ...)
panel_labels:
  enabled: true
  fontsize: 18
  fontweight: "bold"
  position: [-0.18, 0.98]  # [x, y] in axes coordinates (above ylabel)
  va: "bottom"
  ha: "right"

# Font settings
fonts:
  label_size: 8        # xlabel, ylabel
  tick_size: 7         # tick labels
  title_size: 10       # panel titles (if used)
  legend_size: 6        # legend text
  weight: "normal"

# Legend settings
legend:
  frame_linewidth: 0.5

# Grid and frame settings
grid:
  enabled: false
  alpha: 0.3

frame:
  box: true            # Show all four spines (box around plot)
  linewidth: 0.5       # Spine linewidth

# Tick settings
ticks:
  width: 0.5
  length: 3
  direction: "out"

# Error bar settings
error_bars:
  capsize: 4
  capthick: 1.2
  linewidth: 1.2
  alpha: 0.7

# Histogram settings
histogram:
  bins: 50
  alpha: 0.7
  edgecolor: "black"

# Line plot settings
line:
  linewidth: 0.8
  marker_size: 5
  fill_alpha: 0.2
